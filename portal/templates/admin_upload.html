<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Staff Dashboard — SentinelForge</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f4f8; margin: 0; padding: 0; }
        .header { background: #1a3a5c; color: white; padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; }
        .header a { color: white; text-decoration: none; }
        .container { max-width: 700px; margin: 40px auto; background: white; padding: 30px; border-radius: 8px; }
        input[type=file] { padding: 10px; margin: 10px 0; width: 100%; }
        button { padding: 12px 30px; background: #1a3a5c; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .info { background: #eef4fa; padding: 12px; border-radius: 4px; color: #1a3a5c; font-size: 14px; }
    </style>
</head>
<body>
    <div class="header">
        <div><h1>✈ SentinelForge — Staff</h1></div>
        <div>Logged in as <strong>{{ username }}</strong> <a href="/admin/logout">Logout</a></div>
    </div>
    <div class="container">
        <h2>Upload Passenger Manifest</h2>
        <p class="info">Upload the daily passenger manifest file (CSV, XLSX, or PDF). Files are saved to /opt/sf-portal/uploads/.</p>
        <form action="/admin/upload" method="post" enctype="multipart/form-data">
            <input type="file" name="file" required>
            <button type="submit">Upload</button>
        </form>
    </div>
</body>
</html>
