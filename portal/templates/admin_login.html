<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Staff Login — AeroSec Airlines</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f4f8; margin: 0; padding: 0; }
        .header { background: #1a3a5c; color: white; padding: 20px 40px; }
        .container { max-width: 400px; margin: 60px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #1a3a5c; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        .error { background: #fee; color: #c00; padding: 10px; border-radius: 4px; margin: 10px 0; }
    </style>
</head>
<body>
    <div class="header">
        <h1>✈ AeroSec Airlines</h1>
    </div>
    <div class="container">
        <h2>Staff Login</h2>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <form action="/admin/login" method="post">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
